# Don't rename this file. Azure Static Web Apps identifies the app from the workflow's
# generated filename (azure-static-web-apps-<adjective>-<noun>-<hex>.yml) when it checks
# the GitHub OIDC token, and rejects the deploy otherwise. The display name below is free.
name: Deploy to Azure

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  # The daily pipeline's own audio commit can't start this workflow (pushes made with a
  # workflow's GITHUB_TOKEN never trigger other workflows), so redeploy when it finishes,
  # to pick up that day's stories and audio.
  workflow_run:
    workflows: ["Daily AI News"]
    types: [completed]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_run' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # The site is static, so its data is a snapshot taken at deploy time: the same JSON
      # web/server.py serves locally, read from Turso, plus the committed narration MP3s.
      # Both go in web/public/, which the build copies into dist as-is.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e .
      - name: Snapshot the dashboard data and audio
        env:
          AINEWS_BACKEND: turso
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python -m web.server --snapshot web/public/dashboard.json
          mkdir -p web/public/audio
          cp audio/*.mp3 web/public/audio/
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_PLANT_02C93590F }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/web" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_PLANT_02C93590F }}
          app_location: "/web"
          action: "close"
