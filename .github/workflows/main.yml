name: Daily AI News

on:
  workflow_dispatch:

  schedule:
    # Plain UTC cron, not the `timezone:` key: that's a GitHub Actions "Public Preview"
    # feature (shipped March 2026) that silently dropped this schedule entirely in
    # testing, with no error anywhere. 17 7 * * * = 9:17 Europe/Copenhagen while it
    # observes DST (UTC+2). Switch to "33 8 * * *" when Denmark moves to CET (UTC+1),
    # in late October, to keep the same 9:33 local time.
    - cron: "33 2 * * *"

permissions:
  contents: write  # the last step commits and pushes the day's narration audio

concurrency:
  group: daily-ai-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    env:
      AINEWS_BACKEND: turso
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ffmpeg
        # Not preinstalled on ubuntu-latest (confirmed against the runner image's own
        # software manifest). Required for narrate's loudness normalization step.
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -e .

      # Every stage below talks to the hosted Turso database over HTTP (Hrana), which
      # holds one long-lived "stream" per command; that stream can occasionally expire
      # or get recycled mid-run (seen in practice as "HTTP status 404: stream not
      # found"), independent of anything the pipeline itself did wrong. Each stage is
      # already idempotent per item/run (see README's "Reruns and failure handling"),
      # so retrying the whole command once is safe: work already stored is skipped, not
      # redone. One retry after a short wait, not a loop - a second failure is treated
      # as a genuine problem, not more transient flakiness.

      - name: Ingest articles
        run: |
          python -m ainews ingest && exit 0
          echo "::warning::Ingest articles failed; retrying once after 20s."
          sleep 20
          python -m ainews ingest && exit 0
          echo "::error::Ingest articles failed after 2 attempts."
          exit 1

      - name: Extract article content
        run: |
          python -m ainews extract && exit 0
          echo "::warning::Extract article content failed; retrying once after 20s."
          sleep 20
          python -m ainews extract && exit 0
          echo "::error::Extract article content failed after 2 attempts."
          exit 1

      - name: Enrich articles
        run: |
          python -m ainews enrich && exit 0
          echo "::warning::Enrich articles failed; retrying once after 20s."
          sleep 20
          python -m ainews enrich && exit 0
          echo "::error::Enrich articles failed after 2 attempts."
          exit 1

      - name: Cluster stories
        run: |
          python -m ainews cluster && exit 0
          echo "::warning::Cluster stories failed; retrying once after 20s."
          sleep 20
          python -m ainews cluster && exit 0
          echo "::error::Cluster stories failed after 2 attempts."
          exit 1

      - name: Generate digests
        run: |
          python -m ainews digest && exit 0
          echo "::warning::Generate digests failed; retrying once after 20s."
          sleep 20
          python -m ainews digest && exit 0
          echo "::error::Generate digests failed after 2 attempts."
          exit 1

      - name: Generate narration audio
        # No continue-on-error needed: `narrate` itself now only exits non-zero for a
        # genuine stage failure (no fully processed run, config/database problems), not
        # for one category's isolated script/TTS failure, which it already reports and
        # isolates internally.
        run: |
          python -m ainews narrate && exit 0
          echo "::warning::Generate narration audio failed; retrying once after 20s."
          sleep 20
          python -m ainews narrate && exit 0
          echo "::error::Generate narration audio failed after 2 attempts."
          exit 1

      - name: Commit and push updated audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only ever stages audio/*.mp3 - never `git add -A` or `git add .` - so nothing
          # else generated during the run (there shouldn't be anything, since
          # AINEWS_BACKEND=turso means no local database file is created either) can be
          # committed by accident. `|| true` covers the very first run, before audio/
          # exists at all, when the glob matches nothing.
          git add audio/*.mp3 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No audio changes to commit."
          else
            git commit -m "Update daily narration audio"
            # HEAD:<branch>, not a bare `git push`: works whether or not this checkout
            # left HEAD detached (schedule/workflow_dispatch shouldn't, but this needs no
            # tracking branch to already be set up either way).
            git push origin HEAD:${{ github.ref_name }}
          fi
