# RSS/Atom sources. To add one, append a [[feeds]] table.
#
#   name          stored on each article as its source, so keep names stable
#   url           the RSS/Atom feed
#   strategy      how article text is acquired (required):
#                   "feed_content"  the feed's own text is the article text
#                   "fulltext"      fetch the article page and extract its main text
#   stop_markers  optional, fulltext only: extracted text is cut at the first paragraph
#                 equal to one of these (a site's trailing subscription block, say)
#   request_delay_seconds
#                 optional, fulltext only: seconds to wait between two page requests to
#                 this feed's site in one `extract` run (for sites that refuse rapid requests)
#
# To choose a strategy for a new source, run:
#     python -m ainews inspect-feed <feed-url> --samples 3
# It reports the evidence; the decision is yours.

[[feeds]]
name = "OpenAI"
url = "https://openai.com/news/rss.xml"
# The official RSS feed is used for discovery; full article text is extracted from the linked webpage. OpenAI pages may intermittently return a Cloudflare 403.
strategy = "fulltext"
# Pause between consecutive OpenAI page requests, to reduce those 403s.
request_delay_seconds = 1

[[feeds]]
name = "Google DeepMind"
url = "https://deepmind.google/blog/rss.xml"
# The feed carries no text at all.
strategy = "fulltext"

[[feeds]]
name = "Google AI"
url = "https://blog.google/innovation-and-ai/technology/ai/rss/"
# The feed contains short teasers; full article pages extract substantially more content.
strategy = "fulltext"

[[feeds]]
name = "Microsoft Research"
url = "https://www.microsoft.com/en-us/research/feed"
# The feed contains substantial full article content, exceeding the extracted webpage text.
strategy = "feed_content"

[[feeds]]
name = "Ars Technica AI"
url = "https://arstechnica.com/ai/feed/"
# The feed contains article excerpts, while full-page extraction retrieves substantially more of the article content.
strategy = "fulltext"

[[feeds]]
name = "Tech.eu"
url = "https://tech.eu/feed/"
# The feed contains substantial full article content and is slightly more complete than webpage extraction.
strategy = "feed_content"

[[feeds]]
name = "TechSavvy"
url = "https://techsavvy.media/feed/"
# Danish-language tech news. The RSS feed contains short summaries only; webpage extraction provides the full article content.
strategy = "fulltext"

[[feeds]]
name = "Bootstrapping"
url = "https://bootstrapping.dk/feed/"
# Danish-language startup and tech news. The RSS feed provides full article content, so webpage extraction is unnecessary.
strategy = "feed_content"

[[feeds]]
name = "FW.MEDIA"
url = "https://www.fw.media/feed"
# English-language European technology and innovation news. The RSS feed contains short summaries only; webpage extraction provides the full article content.
strategy = "fulltext"

[[feeds]]
name = "Hugging Face"
url = "https://huggingface.co/blog/feed.xml"
# The feed carries no text at all. Extraction can drop an article's first sentence.
strategy = "fulltext"

[[feeds]]
name = "Mistral"
url = "https://mistral.ai/news/rss"
# Feed text is a one-sentence teaser, and most entries have none.
strategy = "fulltext"

[[feeds]]
name = "The Decoder"
url = "https://the-decoder.com/feed/"
strategy = "fulltext"
# Every article page ends with a subscription pitch that starts at this line.
stop_markers = ["AI News Without the Hype – Curated by Humans"]

[[feeds]]
name = "Simon Willison"
url = "https://simonwillison.net/atom/everything/"
# The feed already contains the whole post; the page only adds a date and a sidebar.
strategy = "feed_content"

[[feeds]]
name = "TechCrunch AI"
url = "https://techcrunch.com/category/artificial-intelligence/feed/"
# The feed text is a teaser of about 100 characters.
strategy = "fulltext"
